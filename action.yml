name: "CI Early-Warn Beacon"
description: "Anonymized runner-image health beacon for CI Early-Warn: flags GitHub runner-image regressions across orgs."
inputs:
  endpoint: {description: "Collector beacon URL", required: false, default: "https://collector-production-5b85.up.railway.app/v1/beacon"}
  token: {description: "CI Early-Warn tenant token (store as secret EW_TOKEN)", required: true}
  github-token: {description: "GITHUB_TOKEN; needs actions:read only", required: false, default: "${{ github.token }}"}
  job-status: {description: "The job status; pass the job.status context expression", required: true}
  send-toolchain: {description: "Send toolchain major.minor versions", required: false, default: "true"}
  oidc: {description: "Attach a GitHub OIDC token to verify the tenant (needs permissions: id-token: write)", required: false, default: "true"}
runs:
  using: node20
  main: index.js
branding:
  icon: "alert-triangle"
  color: "orange"
